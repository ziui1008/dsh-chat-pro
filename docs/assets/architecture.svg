<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" fill="none" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="880" height="340" fill="#F7F8FA"/>
  <text x="40" y="46" font-size="18" font-weight="600" fill="#1B1F24">chat-demo-in-dsh 的一次请求</text>
  <text x="40" y="70" font-size="13" fill="#5B6470">侧栏面板里是官方 chat-demo 的界面；密钥在 DSH 里，会话在浏览器里。</text>

  <rect x="40" y="100" width="240" height="160" rx="12" fill="#FFFFFF" stroke="#D8DDE5"/>
  <text x="60" y="130" font-size="13" font-weight="600" fill="#1B1F24">浏览器</text>
  <rect x="60" y="144" width="200" height="34" rx="8" fill="#EEF3FF" stroke="#C9D8FF"/>
  <text x="76" y="166" font-size="12" fill="#2A4FB0">chat-demo 前端</text>
  <rect x="60" y="188" width="200" height="34" rx="8" fill="#F2F4F7"/>
  <text x="76" y="210" font-size="12" fill="#5B6470">会话存在本地存储</text>

  <rect x="325" y="100" width="240" height="160" rx="12" fill="#FFFFFF" stroke="#D8DDE5"/>
  <text x="345" y="130" font-size="13" font-weight="600" fill="#1B1F24">DSH 宿主插件</text>
  <rect x="345" y="144" width="200" height="34" rx="8" fill="#EEF7F0" stroke="#C6E5D0"/>
  <text x="361" y="166" font-size="12" fill="#1F6B3B">/webchat 静态资源</text>
  <rect x="345" y="188" width="200" height="34" rx="8" fill="#EEF7F0" stroke="#C6E5D0"/>
  <text x="361" y="210" font-size="12" fill="#1F6B3B">转发 · 用 DSH 账户凭据</text>

  <rect x="610" y="100" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#D8DDE5"/>
  <text x="630" y="130" font-size="13" font-weight="600" fill="#1B1F24">DeepSeek API</text>
  <text x="630" y="154" font-size="12" fill="#5B6470">官方 Messages 协议</text>
  <text x="630" y="178" font-size="12" fill="#5B6470">服务端搜索 / 读链接</text>
  <text x="630" y="202" font-size="12" fill="#5B6470">安全审核</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#8A94A6"/>
    </marker>
  </defs>
  <line x1="280" y1="172" x2="320" y2="172" stroke="#8A94A6" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="565" y1="172" x2="605" y2="172" stroke="#8A94A6" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="40" y="300" font-size="12" fill="#5B6470">DSH 会话不在这个流程里：网页版用官方那一句提示词与服务端工具，DSH 对话带工程规范与本地工具，两者刻意不互通。</text>
</svg>
