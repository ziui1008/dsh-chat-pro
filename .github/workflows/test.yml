name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 语法检查
        run: |
          node --check index.js
          node --check client.js
          node --check src/protocol.js
          node --check src/webview.js
          node --check scripts/smoke-webview.mjs

      - name: 清单可解析
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"

      - name: 单元测试
        run: node --test test/protocol.test.js test/dsh-import.test.js

